[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sdr-mamba"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
test = ["pytest>=8"]
ssd = ["mamba-ssm"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
